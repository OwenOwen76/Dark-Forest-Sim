[project]
name = "dark-forest-sim"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dark-forest-civ-mcp = "dark_forest_sim.civilization_mcp:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["dark_forest_sim*"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "strict"
